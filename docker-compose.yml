services:
  api:
    build: .
    environment:
      ASSET_REGISTRY_DATABASE_URL: postgresql+psycopg://asset_registry:asset_registry@postgres:5432/asset_registry
      ASSET_REGISTRY_ENVIRONMENT: development
      ASSET_REGISTRY_NETWORK: liquidtestnet
      ASSET_REGISTRY_ESPLORA_URL: https://blockstream.info/liquidtestnet/api
      ASSET_REGISTRY_DNS_OVER_HTTPS_URL: https://dns.google/resolve
      ASSET_REGISTRY_ENFORCE_CHAIN_VERIFICATION: "true"
      ASSET_REGISTRY_ENFORCE_DOMAIN_VERIFICATION: "true"
      ASSET_REGISTRY_LEGACY_SHADOW_WRITE: "false"
      ASSET_REGISTRY_LEGACY_BASE_URL: ${ASSET_REGISTRY_LEGACY_BASE_URL:-https://assets-testnet.blockstream.info}
      ASSET_REGISTRY_LEGACY_TIMEOUT_SECONDS: "10"
      ASSET_REGISTRY_LEGACY_FAILURE_SANITY_DELAY_SECONDS: "5"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn registry_api.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: asset_registry
      POSTGRES_USER: asset_registry
      POSTGRES_PASSWORD: asset_registry
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_registry -d asset_registry"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
