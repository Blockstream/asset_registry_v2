components:
  schemas:
    AddAdminAction:
      properties:
        signing_context:
          type: string
          const: liquid-asset-registry-admin-action-v1
          title: Signing Context
        actor_pubkey:
          type: string
          maxLength: 66
          minLength: 66
          pattern: ^(02|03)[0-9a-fA-F]{64}$
          title: Actor Pubkey
        operation:
          type: string
          const: add_admin
          title: Operation
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        nonce:
          type: string
          maxLength: 128
          minLength: 8
          title: Nonce
        admin_pubkey:
          type: string
          maxLength: 66
          minLength: 66
          pattern: ^(02|03)[0-9a-fA-F]{64}$
          title: Admin Pubkey
        friendly_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Friendly Name
        permissions:
          items:
            type: string
            enum:
            - root
            - annotate_assets
            - delist_assets
            - review_icons
            - manage_icons
            - manage_admins
            - migrate_assets
          type: array
          uniqueItems: true
          title: Permissions
      additionalProperties: false
      type: object
      required:
      - signing_context
      - actor_pubkey
      - operation
      - timestamp
      - nonce
      - admin_pubkey
      - friendly_name
      title: AddAdminAction
    AdminActionResponse:
      properties:
        status:
          type: string
          enum:
          - applied
          - idempotent_retry
          title: Status
        audit_entry:
          $ref: '#/components/schemas/AuditEntry'
      additionalProperties: false
      type: object
      required:
      - status
      - audit_entry
      title: AdminActionResponse
    AdminActionSummary:
      properties:
        action:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
        admin_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Admin Id
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
      additionalProperties: false
      type: object
      title: AdminActionSummary
    AdminAnnotations:
      properties:
        asset_type:
          anyOf:
          - type: string
            enum:
            - AMP_asset
            - stablecoin
            - security_token
            - other
          - type: 'null'
          title: Asset Type
        featured:
          type: boolean
          title: Featured
          default: false
        malicious:
          type: boolean
          title: Malicious
          default: false
        delisted:
          type: boolean
          title: Delisted
          default: false
        admin_notes:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          pattern: ^[^\x00]*$
          title: Admin Notes
        last_admin_action:
