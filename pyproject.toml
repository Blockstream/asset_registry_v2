[project]
name = "liquid-asset-registry"
version = "0.1.0"
description = "FastAPI service for the Liquid Asset Registry v2 API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Registry contributors" },
]
requires-python = ">=3.11"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.13,<2",
    "fastapi==0.139.0",
    "httpcore>=1.0,<1.1",
    "httpx>=0.28,<0.29",
    "Pillow>=12.3,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy>=2.0,<3",
    "starlette==1.3.1",
    "uvicorn[standard]>=0.30,<1",
    "wallycore>=1.5,<2",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["registry_api*"]

[tool.setuptools.package-data]
registry_api = ["data/*.png"]

[project.optional-dependencies]
dev = [
    "PyYAML==6.0.3",
    "pytest==9.1.1",
    "schemathesis==4.22.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
