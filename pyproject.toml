[project]
name = "liquid-asset-registry"
version = "0.1.0"
description = "FastAPI service for the Liquid Asset Registry v2 API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Registry contributors" },
]
requires-python = ">=3.11"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi==0.162.0",
    "httpcore>=1.0.9,<1.1",
    "httpx>=0.28.1,<0.29",
    "Pillow>=13.0.0,<14",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy>=2.1.6,<3",
    "starlette==1.10.0",
    "uvicorn[standard]>=0.54.0,<1",
    "wallycore>=1.5.6,<2",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["registry_api*"]

[tool.setuptools.package-data]
registry_api = ["data/*.png"]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
    "schemathesis==4.32.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
